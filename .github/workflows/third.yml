name: Demo - Environment variables and secrets

on: 
  push
    # workflow_dispatch: 
env:
  GLOBAL_APP_ENV: GLOBAL_APP_ENV
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Say Hello
              run: echo 'Hello from Demo workflow'
            
            - name: Install
              env:
                
                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: echo "My Environment $GLOBAL_APP_ENV and Password $DB_PASSWORD"
            
            - name: Create demo file
              run: 
                echo "This is a test file" > file.txt
                echo "File created successfully"

            - name: Upload Demo
              uses: actions/upload-artifact@v7
              with: 
                name: build-artefact-Demo
                path: .
    test:
      runs-on: ubuntu-latest
      needs: build
      
      steps:
        - name: Test jobs
          run: echo "Build runs successfully"

